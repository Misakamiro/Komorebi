<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- 两个半圆组成一个完整圆环 -->
  <g transform-origin="12 12">
	<!-- 右半环 -->
	<path
		d="M12 3
		   A9 9 0 0 1 12 21"
		fill="none" stroke="hwb(var(--primaryColor))" stroke-width="2.5" stroke-linecap="round"/>
	<!-- 左半环 -->
	<path
		d="M12 3
		   A9 9 0 0 0 12 21"
		fill="none" stroke="hwb(var(--primaryColor) / 0.1)" stroke-width="2.5" stroke-linecap="round"/>
	<!-- 旋转动画 -->
	<animateTransform
		attributeName="transform"
		type="rotate"
		from="0 12 12" to="360 12 12"
		dur="1s" repeatCount="indefinite"
	/>
  </g>
</svg>
